apiVersion: v1
kind: Secret
metadata:
  name: oidc
type: Opaque
stringData:
  issuer: http://keycloak:8080/realms/rsoi
  jwks-url: http://keycloak:8080/realms/rsoi/protocol/openid-connect/certs
  token-url: http://keycloak:8080/realms/rsoi/protocol/openid-connect/token
  client-id: rsoi-gateway
  client-secret: {{ .Values.clientSecret | quote }}
  user-claim: username
