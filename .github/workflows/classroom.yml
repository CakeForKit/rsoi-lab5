name: GitHub Classroom Workflow
on:
  push:
    branches: [ master ]
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Run unit tests and vet
        run: |
          for module in lb-core ms-flight ms-ticket ms-bonus ms-gateway; do
            (cd "$module" && GOWORK=off go test ./... && GOWORK=off go vet ./...)
          done

      - name: Build Docker images
        run: docker compose build
        env:
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Publish images
        if: github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: docker compose push ms-flight ms-ticket ms-bonus ms-gateway
        env:
          DOCKER_REGISTRY: ${{ env.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/master' && env.KUBECONFIG_B64 != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to Kubernetes
        if: github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.KUBECONFIG_B64 != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          kubectl create namespace rsoi --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install postgres helm/postgres --namespace rsoi --wait --timeout 3m
          helm upgrade --install keycloak helm/keycloak --namespace rsoi --wait --timeout 3m
          for values in helm/microservice/values-ms-*.yaml; do
            release=${values##*/values-}; release=${release%.yaml}
            helm upgrade --install "$release" helm/microservice --namespace rsoi --wait --timeout 3m -f "$values" \
              --set image.repository="$DOCKERHUB_USERNAME/rsoi-lab5-$release" --set image.tag="$GITHUB_SHA"
          done

      - name: Connect tests to Kubernetes services
        if: github.ref == 'refs/heads/master' && env.DOCKERHUB_USERNAME != '' && env.KUBECONFIG_B64 != ''
        run: |
          kubectl -n rsoi port-forward service/ms-gateway 8080:8080 >/tmp/ms-gateway-port-forward.log 2>&1 &
          echo $! > /tmp/ms-gateway-port-forward.pid
          kubectl -n rsoi port-forward service/keycloak 8180:8080 >/tmp/keycloak-port-forward.log 2>&1 &
          echo $! > /tmp/keycloak-port-forward.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8180/realms/rsoi/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready" >&2
          exit 1

      - uses: education/autograding@v1
        id: autograder

      - name: Stop Kubernetes port forwards
        if: always()
        run: |
          test -f /tmp/ms-gateway-port-forward.pid && kill "$(cat /tmp/ms-gateway-port-forward.pid)" || true
          test -f /tmp/keycloak-port-forward.pid && kill "$(cat /tmp/keycloak-port-forward.pid)" || true

